services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rook
      POSTGRES_USER: rook
      POSTGRES_PASSWORD: rook-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rook -d rook"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rook-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://rook:rook-local-only@postgres:5432/rook
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "false"
      DEMO_MODE: "true"
      DEMO_OBSERVATION_SECONDS: "0.8"
      DEMO_SAMPLE_COUNT: "200"
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg://rook:rook-local-only@postgres:5432/rook
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_started

  sample-app:
    build:
      context: ./sample-app
    environment:
      APP_VERSION: v1
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  rook-postgres:
