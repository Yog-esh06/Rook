apiVersion: v1
kind: ServiceAccount
metadata:
  name: rook-sample-app
  namespace: rook-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rook-sample-app
  namespace: rook-demo
  labels:
    app.kubernetes.io/name: rook-sample-app
    app.kubernetes.io/part-of: rook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rook-sample-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rook-sample-app
        app.kubernetes.io/part-of: rook
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: rook-sample-app
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sample-app
          image: rook/sample-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: v1
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rook-sample-app
  namespace: rook-demo
  labels:
    app.kubernetes.io/name: rook-sample-app
    app.kubernetes.io/part-of: rook
spec:
  selector:
    app.kubernetes.io/name: rook-sample-app
  ports:
    - name: http
      port: 8080
      targetPort: http
