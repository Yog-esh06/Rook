apiVersion: v1
kind: ServiceAccount
metadata:
  name: rook-control-plane
  namespace: rook-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rook-control-plane
  namespace: rook-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/status", "events", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rook-control-plane
  namespace: rook-demo
subjects:
  - kind: ServiceAccount
    name: rook-control-plane
    namespace: rook-demo
roleRef:
  kind: Role
  name: rook-control-plane
  apiGroup: rbac.authorization.k8s.io
