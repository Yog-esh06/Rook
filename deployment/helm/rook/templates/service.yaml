apiVersion: v1
kind: Service
metadata:
  name: {{ include "rook.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "rook.name" . }}
    app.kubernetes.io/part-of: rook
spec:
  selector:
    app.kubernetes.io/name: {{ include "rook.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
